<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rocket Launch: Weather Challenge</title>
  <style>
    body { background: #182447; color: #e2eef8; font-family: Arial, sans-serif; text-align: center; }
    .rocket-area { margin: 50px auto 24px auto; min-height: 140px; }
    .rocket { font-size: 70px; transition: margin-bottom 1s, filter 0.8s; margin-bottom: 0;}
    .rocket.launch { margin-bottom: 220px; filter: brightness(1.5) drop-shadow(0 12px 45px #ffb400); }
    h1 { letter-spacing: 1.5px; margin-top: 36px; }
    .weather-form { background: #233360; padding: 32px 20px 16px 20px; border-radius: 18px;
      max-width: 350px; margin: 0 auto; box-shadow: 0 3px 24px #16243899;}
    label { display: block; margin: 18px 0 7px 0; font-size: 18px;}
    select, input[type="number"] {
      font-size: 17px; padding: 8px 14px; border-radius: 7px; border: 1px solid #aaa;
      background: #e0edfa;
      margin-bottom: 7px;
      width: 70%;
    }
    .btn-launch {
      font-size: 20px;
      background: #ffb400; color: #333;
      border: none; border-radius: 11px;
      padding: 12px 38px; margin: 26px 0 13px 0;
      font-weight: bold; letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 2px 12px #ffb40021;
      transition: background 0.18s;
    }
    .btn-launch:hover {background: #e78a00;}
    .msg { min-height: 38px; font-size: 1.2em; margin-top: 10px;}
    .info { color: #e2a900; margin-top: 10px; }
    .credits { margin: 22px 0 0 0; font-size: 13px; color: #aaa;}
  </style>
</head>
<body>
  <h1>Rocket Launch Weather Challenge</h1>
  <div class="rocket-area">
    <span class="rocket" id="rocket" aria-hidden="true">🚀</span>
  </div>
  <div class="weather-form">
    <div><strong>Cape Canaveral, Florida</strong></div>
    <label for="weather">Weather Condition:</label>
    <select id="weather">
      <option value="">--Select Weather--</option>
      <option value="Clear">Clear ☀️</option>
      <option value="Clouds">Clouds ☁️</option>
      <option value="Rain">Rain 🌧️</option>
      <option value="Thunderstorm">Thunderstorm ⛈️</option>
      <option value="Drizzle">Drizzle 🌦️</option>
      <option value="Snow">Snow ❄️</option>
      <option value="Mist">Mist 🌫️</option>
      <option value="Fog">Fog 🌁</option>
      <option value="Haze">Haze 🌁</option>
      <option value="Dust">Dust 🌬️</option>
      <option value="Smoke">Smoke 🚬</option>
    </select>
    <label for="temp">Temperature (°C):</label>
    <input type="number" id="temp" placeholder="Enter temperature" />
    <br>
    <button class="btn-launch" onclick="launch()">Launch Rocket</button>
    <div class="msg" id="msg"></div>
    <div class="info" id="info">Tip: Check the real weather for Cape Canaveral!</div>
  </div>
  <div class="credits">
    Data via Open-Meteo • Game by Copilot &amp; Unkn5wn
  </div>
  <script>
    // Cape Canaveral, FL coordinates
    const LAT = 28.3922, LON = -80.6077;
    // For weather mapping (Open-Meteo codes → description)
    const weather_groups = {
      0: "Clear", 1: "Clear",
      2: "Clouds", 3: "Clouds", 45:"Mist", 48:"Fog",
      51: "Drizzle", 53: "Drizzle", 55: "Drizzle",
      56: "Drizzle", 57: "Drizzle",
      61: "Rain", 63: "Rain", 65: "Rain",
      66: "Rain", 67: "Rain",
      71: "Snow", 73: "Snow", 75: "Snow", 77: "Snow", 85: "Snow", 86: "Snow",
      80: "Rain", 81: "Rain", 82:"Rain",
      95: "Thunderstorm", 96: "Thunderstorm", 99:"Thunderstorm",
    };
    // Fallback for rare codes:
    function mapWeather(code) {
      return weather_groups[code] || "Clear";
    }

    async function getCurrentWeather() {
      // Open-Meteo free API, no key needed
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error("Weather API error");
      const data = await resp.json();
      const temp = Math.round(data.current_weather.temperature); // °C
      const code = data.current_weather.weathercode;
      const main = mapWeather(code);
      return { temp, main };
    }

    const msgDiv = document.getElementById('msg');
    const rocket = document.getElementById('rocket');
    function clearMsg() { msgDiv.textContent = ""; }

    async function launch() {
      clearMsg();
      rocket.classList.remove("launch");
      const sel = document.getElementById('weather').value;
      const tempInp = document.getElementById('temp').value.trim();
      if (!sel) { msgDiv.textContent = "Select a weather condition!"; return; }
      if (!tempInp) { msgDiv.textContent = "Enter the temperature!"; return; }
      msgDiv.textContent = "Checking real weather at Cape Canaveral...";
      let realWeather;
      try {
        realWeather = await getCurrentWeather();
      } catch (e) {
        msgDiv.textContent = "Couldn't fetch current weather. Try again later.";
        return;
      }
      // Block launch if real weather is Rain
      if (realWeather.main === "Rain") {
        msgDiv.innerHTML =
          `Raining, can't launch the rocket!<br>
           Current: Rain (${realWeather.temp}°C).`;
        return;
      }
      // Accept small error margin for temp (+/- 1°C)
      const userTemp = parseInt(tempInp, 10);
      const tempOK = Math.abs(realWeather.temp - userTemp) <= 1;
      const weatherOK = (sel === realWeather.main);
      if (tempOK && weatherOK) {
        msgDiv.textContent = "Correct! Rocket Launching! 🚀";
        rocket.classList.add("launch");
      } else {
        msgDiv.innerHTML =
          `Launch blocked.<br>
          Current: ${realWeather.main} (${realWeather.temp}°C).<br>
          Try again!`;
      }
    }
  </script>
</body>
</html>
