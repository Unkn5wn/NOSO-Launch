<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automatic Checks Game</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body { min-height:100vh; }
    body {
      background: #181e33;
      color: #e3f2fd;
      font-family: Arial, sans-serif;
      margin: 0; padding: 0; min-height: 100vh; position:relative;
      overflow-x:hidden;
    }
    #space-canvas {
      position: fixed;
      z-index: 0;
      top:0; left:0; width:100vw; height:100vh; pointer-events:none;
      display:block;
      background: transparent;
    }
    .container {
      position: relative;
      z-index: 2;
      max-width: 760px;
      margin: 38px auto 32px auto;
      background: rgba(30,34,60,0.98);
      padding: 30px 14px 24px 14px;
      border-radius: 16px;
      box-shadow: 0 3px 40px #223, 0 0px 0 2.5px #dde1ff33;
    }
    h1 { text-align: center; margin-bottom: 12px; color: #ffebc9; }
    .scorebar { text-align:center; font-size: 1.05em; margin: 6px 0 15px 0; color: #f7eba0; font-weight: bold;}
    .timerbar { text-align: center; font-size: 1.04em; color: #b4f9ec; font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; }
    .main-columns { display: flex; gap: 28px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap;}
    .col { background: rgba(44,49,88,0.98); border-radius: 11px; padding: 16px 14px; box-shadow: 0 2px 12px #2c3755ac; min-width: 220px; flex: 1 1 240px; margin-bottom: 16px; box-sizing: border-box;}
    .col h3 { color: #ffeeaa; font-size: 18px; margin: 0 0 11px 0;}
    .checklist li { margin-bottom: 6px; font-size: 15.5px; list-style-type: "— ";}
    .checklist strong { color: #e3bd57; }
    .check-sum { font-weight: bold; color: #8ffcce; }
    .controls { margin: 19px 0 10px 0; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; margin-left: auto; margin-right: auto;}
    .button-row { display: flex; flex-direction: row; gap: 10px; width: 100%; justify-content: center; margin-bottom: 5px;}
    .button-row button { font-size: 13px; background: #146593; border: none; border-radius: 7px; color: #fff; font-weight: bold; cursor: pointer; box-shadow: 0 2px 8px #0080c099; letter-spacing: 1px; transition: background 0.12s; min-width: 135px; max-width: 210px; padding: 7px 0; text-align: center; flex: 1 1 0; margin: 0; box-sizing: border-box;}
    .button-row button:hover { background: #3196c7; }
    .button-row button:disabled { background: #596e7f; cursor: not-allowed;}
    .reason-area { margin-bottom: 0; width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: stretch; gap: 3px;}
    .reason-area label { background: none; color: #fffacd; font-size: 13px; font-weight: normal; cursor: pointer; padding: 4px 2px 4px 0; display: flex; align-items: center; width: 100%; min-width: 135px; max-width: 300px;}
    .controls input[type="checkbox"] { transform: scale(1.11); margin-right: 15px;}
    #submitBtn { font-size: 14px; background: #146593; padding: 7px 0; border: none; border-radius: 7px; color: #fff; font-weight: bold; cursor: pointer; box-shadow: 0 2px 8px #0080c099; letter-spacing: 1px; transition: background 0.12s; width: 95%; min-width: 110px; max-width: 300px; margin: 9px auto 0 auto;}
    #submitBtn:hover { background: #3196c7; }
    #submitBtn:disabled { background: #596e7f; cursor:not-allowed; }
    .success { color: #a0ffb6; font-weight: bold; }
    .wrong   { color: #ffe363; font-weight: bold; }
    .status { text-align: center; font-size: 1.11em; margin: 10px 0 0 0; min-height: 24px;}
    .footer { text-align: center; margin: 38px 0 0 0; color: #e5e7ff89; font-size: 13px; letter-spacing: 1px; }
    .tipbar { display: block; position: fixed; left: 0; right: 0; bottom: 0; background: #35377a; color: #ffd; font-size: 1.01em; padding: 9px 2vw 5px 2vw; text-align: center; font-family: Arial,sans-serif; letter-spacing: 1px; z-index: 10; border-top: 2.5px solid #cde9ff27; box-shadow: 0 -2px 18px #13213799; user-select: none; opacity: 0.96; min-height: 28px; font-weight: 600; }
    .endgamebox { margin: 35px auto 0 auto; background: #2d3360; border-radius: 13px; padding: 30px 15px 22px 15px; text-align: center; box-shadow: 0 6px 40px #0116b044; font-size: 1.18em; font-weight: bold; color: #ffffe8; max-width: 430px; border: 2.5px solid #6ef1ff6b;}
    .endgamebox .bigscore { font-size: 1.38em; color: #8fffc7; font-weight: bold;}
    .endgamebox .timetotal { color: #adecff; display:block; font-size:1.1em; margin-top:7px;}
    .endgamebox .result-txt { display: block; font-size: 1.28em; margin-top: 12px; font-weight: bold;}
    .endgamebox .hired { color: #c2fd6b; }
    .endgamebox .considered { color: #ffe67e; }
    .endgamebox .rejected { color: #ff9393; }
    .endgamebox button { margin-top: 19px; background: #254ba7; color: #fff; font-size: 1em; padding: 7px 30px; border-radius: 8px; border: none; box-shadow: 0 2px 10px #254ba7bb; font-weight:bold; cursor:pointer; letter-spacing:1px; transition: background 0.12s;}
    .endgamebox button:hover { background: #1c386f;}
    @media (max-width: 650px) {
      .container { max-width: 98vw; }
      .main-columns { flex-direction: column; gap: 10px; }
      .col { min-width: 0; width: 98vw; }
      .reason-area, .controls, .button-row { max-width: 96vw; }
      .button-row { gap: 5px; }
      .button-row button { min-width: 86px; font-size:11.5px; padding: 6px 0; }
      .controls { padding-left: 0; padding-right: 0;}
    }
    @media (max-width: 430px) {
      .container { padding-left: 2vw; padding-right: 2vw; }
      .main-columns, .col, .controls, .reason-area { min-width: 0; max-width: 100vw; }
      .button-row button, .controls label, #submitBtn { font-size:10.5px; min-width: 64px;}
    }
  </style>
</head>
<body>
  <canvas id="space-canvas"></canvas>
  <div class="container" id="main-container">
    <h1>Automatic Checks Game</h1>
    <div class="timerbar">Time Elapsed: <span id="timerVal">0:00</span></div>
    <div class="scorebar">
      Correct: <span id="scoreGood">0</span>
      &nbsp;|&nbsp;
      Missed: <span id="scoreBad">0</span>
      &nbsp;|&nbsp;
      Round: <span id="roundNum">1</span>/20
    </div>
    <div class="main-columns" id="main-columns">
      <div class="col">
        <h3>Client Invoice</h3>
        <ul id="bill-list" class="checklist"></ul>
        <div><span class="check-sum">Total: $<span id="bill-total"></span></span></div>
      </div>
      <div class="col">
        <h3>Checks Received</h3>
        <ul id="check-list" class="checklist"></ul>
        <div><span class="check-sum">Total: $<span id="check-total"></span></span></div>
      </div>
    </div>
    <form class="controls" id="controls" onsubmit="return false;">
      <div class="button-row">
        <button type="button" onclick="approve()" id="approveBtn">Everything paid exactly</button>
        <button type="button" onclick="showReasonArea()" id="problemBtn">There's a problem</button>
      </div>
      <span class="reason-area" id="reasonArea" style="display:none;">
        <label><input type="checkbox" value="missing" class="errChk"> Missing Payment</label>
        <label><input type="checkbox" value="extra" class="errChk"> Extra Check</label>
        <label><input type="checkbox" value="amount" class="errChk"> Wrong Amount</label>
        <label><input type="checkbox" value="tx" class="errChk"> Transaction Number Mismatch</label>
        <label><input type="checkbox" value="combined" class="errChk"> Check Covers Multiple Bills</label>
        <button type="button" onclick="submitReason()" id="submitBtn">Submit</button>
      </span>
    </form>
    <div class="status" id="status"></div>
    <div id="endgame" style="display:none;"></div>
    <div class="footer">Game by Copilot &amp; Unkn5wn</div>
    <div class="tipbar" id="tipbar"></div>
  </div>
  <script>
    // -- ANIMATED EMOJI DISTRACTION LAYER (LIMITED FOR PERFORMANCE) --
    const emojiObjects = [
      {emoji:"🚀", size:32}, {emoji:"🪐", size:28}, {emoji:"🌟", size:22}, {emoji:"🛸", size:28},
      {emoji:"👾", size:26}, {emoji:"👽", size:25}, {emoji:"☄️", size:22}
    ];
    const CANVAS = document.getElementById('space-canvas');
    let spaceW = 0, spaceH = 0;

    function resizeSpaceCanvas() {
      spaceW = window.innerWidth;
      spaceH = window.innerHeight;
      CANVAS.width = spaceW;
      CANVAS.height = spaceH;
    }
    window.addEventListener('resize', resizeSpaceCanvas);

    let distractions = [];
    function addEmojiDistractor() {
      let e = emojiObjects[Math.floor(Math.random()*emojiObjects.length)];
      let fontSize = e.size + Math.random()*10;
      let y = Math.random()*spaceH;
      let left = Math.random()<0.5;
      let x = left ? -fontSize-10 : spaceW+fontSize+10;
      let vx = left ? (Math.random()*0.6+0.25) : -(Math.random()*0.6+0.25);
      let vy = (Math.random()-0.5)*0.12;
      distractions.push({
        emoji: e.emoji,
        x: x, y: y,
        vx:vx, vy:vy,
        sz:fontSize,
        rot: Math.random()*Math.PI*2,
        t: Date.now() + Math.random()*40000
      });
    }

    function drawEmojiDistraction(ctx, obj, time) {
      ctx.save();
      ctx.translate(obj.x, obj.y);
      let w = obj.sz, h = obj.sz;
      ctx.rotate(obj.rot + Math.sin(time/650+obj.x/180)*0.07);
      ctx.font = `${w}px serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowBlur = 6;
      ctx.shadowColor = "#000";
      ctx.globalAlpha = 0.96;
      ctx.fillText(obj.emoji,0,0);
      ctx.restore();
    }

    function animateEmojiSpace() {
      if(spaceW<50||spaceH<50) return;
      const ctx = CANVAS.getContext('2d');
      ctx.clearRect(0,0,spaceW,spaceH);
      // Limit to 7 emoji onscreen for performance
      if(distractions.length < 7) addEmojiDistractor();
      let time = Date.now();
      distractions.forEach(obj => {
        drawEmojiDistraction(ctx,obj, time);
        obj.x += obj.vx;
        obj.y += obj.vy + Math.sin(time/420+obj.x/200)*0.12;
      });
      distractions = distractions.filter(obj =>
        obj.x>-80 && obj.x<spaceW+80 && obj.y>-80 && obj.y<spaceH+80
      );
      requestAnimationFrame(animateEmojiSpace);
    }
    resizeSpaceCanvas();
    setTimeout(animateEmojiSpace, 250);

    // ---- GAME CODE (timed, 20 rounds, as above) ----
    function rand6digits() {
      return String(Math.floor(Math.random() * 900000) + 100000);
    }
    const clients = [
      {name:"OrbitSpace", bills:[{desc: "Satellite Uplink", amount: 600},{desc: "Ground Support", amount: 240},{desc: "Downlink Relay", amount: 160}]},
      {name:"AstroEdge", bills:[{desc: "Lunar Module", amount: 1200},{desc: "Fueling", amount: 330}]},
      {name:"GalacticNet", bills:[{desc:"Space Suit Refurbish", amount:180},{desc:"Module Delivery", amount:920},{desc:"Orbital Dockage", amount:310}]},
      {name:"DeepSpaceOps", bills:[{desc:"Antenna Access", amount: 400},{desc:"Robot Servicing", amount: 280}]},
      {name:"StarFront", bills:[{desc:"Cubesat Handling", amount: 290},{desc:"Launch Transport", amount: 1200}]},
      {name:"NovaFlight", bills:[{desc:"Booster Recovery", amount: 900},{desc:"Telemetry package", amount: 145}]},
      {name:"CelestiWorks", bills:[{desc:"Observation Pass", amount: 80},{desc:"Orbiter Maintenance", amount: 240},{desc:"Science Support", amount: 420}]},
      {name:"Starlance", bills:[{desc:"Environmental Systems", amount: 1300},{desc:"Docking Fee", amount: 120},{desc:"Power Interface", amount: 400}]},
      {name:"LunaTech", bills:[{desc:"Lunar Habitat Resupply", amount: 940}]},
      {name:"Aurora Galaxy", bills:[{desc:"Cosmonaut Meal Pack", amount: 175},{desc:"Promotional Image", amount: 220},{desc:"Deep Space Sat Rental", amount: 580},{desc:"Mission Comms", amount: 155}]},
      {name:"FleetX", bills:[{desc:"Payload Insurance", amount: 210},{desc:"Micro-rocket Propulsion", amount: 1010}]},
      {name:"Cosmosys", bills:[{desc:"Simulator Session", amount: 300},{desc:"GSE Supplies", amount: 120},{desc:"Mission Brief", amount: 75}]}
    ];
    const tips = [
      "<span>Tip:</span> Sum up the checks and bills—if totals mismatch, there's a problem.",
      "<span>Tip:</span> Scan for <b>duplicate transaction numbers</b>—that usually means a payment error!",
      "<span>Tip:</span> Sometimes, a single check may cover multiple bills. Look for an allocation note.",
      "<span>Tip:</span> Some checks may have incorrect amounts—even if the number of checks and bills matches.",
      "<span>Tip:</span> There can be more than one issue in a round. Select all that apply.",
      "<span>Tip:</span> Carefully read every check’s transaction number: all should be unique.",
      "<span>Tip:</span> Extra checks mean the client might have paid for something not invoiced.",
      "<span>Tip:</span> <kbd>Everything paid exactly</kbd> only if all bills are covered—no less, no more!",
      "<span>Tip:</span> If one check covers multiple bills, it will say which ones in the checklist.",
      "<span>Tip:</span> If you’re unsure, double-check the bill and check totals in green.",
      "<span>Tip:</span> If you select “There’s a problem”, double-check you’ve found every issue!"
    ];
    let tipIndex = 0;
    function rotateTip() {
      document.getElementById("tipbar").innerHTML = tips[tipIndex];
      tipIndex = (tipIndex + 1) % tips.length;
    }
    setInterval(rotateTip, 12000);

    let gameData = {};
    let scoreGood = 0, scoreBad = 0, rounds = 0;
    const MAXROUNDS = 20;
    let timerStarted = false;
    let startTime = 0, elapsedSec = 0, timerInt = null;

    function startGlobalTimer() {
      if (!timerStarted) {
        timerStarted = true;
        startTime = Date.now();
        timerInt = setInterval(updateTimerBar, 333);
      }
    }
    function updateTimerBar() {
      let now = Date.now();
      elapsedSec = Math.floor((now - startTime)/1000);
      document.getElementById("timerVal").textContent = mmss(elapsedSec);
    }
    function stopGlobalTimer() {
      if (timerInt) { clearInterval(timerInt); timerInt = null;}
    }
    function mmss(secs) {
      let m = Math.floor(secs/60), s = secs%60;
      return `${m}:${s.toString().padStart(2,"0")}`;
    }
    function pickCase() {
      const client = clients[Math.floor(Math.random()*clients.length)];
      const bills = JSON.parse(JSON.stringify(client.bills));
      const billTotal = bills.reduce((a,b)=>a+b.amount,0);
      let errTypes = [];
      let sc = Math.floor(Math.random()*10)+1;
      if (sc<=3) {
        errTypes = ["ok"];
      } else if (sc<=4) {
        errTypes = ["missing"];
      } else if (sc<=5) {
        errTypes = ["extra"];
      } else if (sc<=6) {
        errTypes = ["amount"];
      } else if (sc<=7) {
        errTypes = ["tx"];
      } else if (sc<=8) {
        errTypes = ["combined"];
      } else if (sc<=9) {
        errTypes = ["combined","tx"];
      } else {
        errTypes = ["amount","extra","tx"];
      }
      let checks = [];
      const billLen = bills.length;
      if (errTypes.includes("ok")) {
        for (let i=0; i<bills.length; ++i) {
          checks.push({num: 1001+i, trans: rand6digits(), amount: bills[i].amount});
        }
      } else if (errTypes.length===1 && errTypes[0]==="missing") {
        for (let i=0; i<bills.length-1; ++i) {
          checks.push({num: 2100+i, trans: rand6digits(), amount: bills[i].amount});
        }
      } else if (errTypes.length===1 && errTypes[0]==="extra") {
        for (let i=0; i<bills.length; ++i) {
          checks.push({num: 2200+i, trans: rand6digits(), amount: bills[i].amount});
        }
        checks.push({
          num: 2200+Math.floor(Math.random()*40),
          trans: rand6digits(),
          amount: Math.floor(Math.random()*176)+45
        });
      } else if (errTypes.includes("combined")) {
        let idxes = bills.map((b,i)=>i);
        for (let i = idxes.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [idxes[i], idxes[j]] = [idxes[j], idxes[i]];
        }
        let combineCount = Math.min(2, Math.max(2, Math.floor(Math.random() * (billLen/1.5))));
        let group = idxes.slice(0, combineCount);
        let rest = idxes.slice(combineCount);
        let sum = group.map(i=>bills[i].amount).reduce((a,b)=>a+b,0);
        let combinedTx = rand6digits();
        checks.push({num: 3100, amount: sum, trans: combinedTx, allocation: group});
        for (let i=0; i<rest.length; ++i) {
          checks.push({
            num: 3101+i,
            amount: bills[rest[i]].amount,
            trans: rand6digits()
          });
        }
        if (errTypes.includes("tx")) {
          checks[0].trans = rand6digits();
        }
      } else if (errTypes.length===1 && errTypes[0]==="amount") {
        for (let i=0; i<bills.length; ++i) {
          let wrong = bills[i].amount;
          if (i === 0) wrong += (Math.floor(Math.random()*49)-24 || 7);
          checks.push({
            num: 4001+i,
            trans: rand6digits(),
            amount: wrong
          });
        }
      } else if (errTypes.includes("tx")) {
        for (let i=0; i<bills.length; ++i) {
          checks.push({
            num: 5001+i,
            trans: i===0 ? "123123" : rand6digits(),
            amount: bills[i].amount
          });
        }
        if (errTypes.includes("amount")) {
          checks[0].amount += Math.floor(Math.random()*17)+1;
        }
        if (errTypes.includes("extra")) {
          checks.push({
            num: 5990 + Math.floor(Math.random()*30),
            trans: "123123",
            amount: Math.floor(Math.random()*94)+28
          });
        }
      } else {
        for (let i=0; i<bills.length; ++i) {
          checks.push({num: 11100+i, trans: rand6digits(), amount: bills[i].amount});
        }
      }
      if (errTypes.includes("tx") && !checks.some((c,i,arr)=>arr.findIndex(x=>x.trans === c.trans)!=i)) {
        if (checks.length > 1) {
          checks[1].trans = checks[0].trans;
        }
      }
      for (let i = 0; i < Math.floor(Math.random()*2); ++i) checks.sort(()=>Math.random()-0.5);
      const checkTotal = checks.reduce((a,b)=>a+b.amount,0);
      gameData = {
        client: client.name,
        bills,
        billTotal,
        checks,
        checkTotal,
        errTypes
      };
    }
    function render() {
      document.getElementById("status").textContent = "";
      document.getElementById("reasonArea").style.display="none";
      document.getElementById("approveBtn").disabled = false;
      document.getElementById("problemBtn").disabled = false;
      document.getElementById("submitBtn").disabled = false;
      document.querySelector("h3").innerHTML = `Client Invoice<br><span style="color:#bdebff;font-size:15px">${gameData.client}</span>`;
      document.getElementById("bill-list").innerHTML =
        gameData.bills.map(b=>`<li>${b.desc}: <strong>$${b.amount}</strong></li>`).join("");
      document.getElementById("bill-total").textContent = gameData.billTotal;
      document.getElementById("check-list").innerHTML =
        gameData.checks.map(c=>{
          let alloc = "";
          if (c.allocation && c.allocation.length > 1) {
            alloc = `<span class="alloc">(This check covers: ${
              c.allocation.map(i=>gameData.bills[i].desc).join(", ")
            })</span>`;
          }
          return `<li>Check #<strong>${c.num}</strong> — <strong>$${c.amount}</strong>
            <span class="trans">TX:${c.trans}</span>${alloc}
          </li>`;
        }).join("");
      document.getElementById("check-total").textContent = gameData.checkTotal;
      document.getElementById("scoreGood").textContent = scoreGood;
      document.getElementById("scoreBad").textContent = scoreBad;
      document.getElementById("roundNum").textContent = (rounds+1);
      document.querySelectorAll('.errChk').forEach(e=>e.checked=false);
      if (tipIndex===0) setTimeout(rotateTip,300);
      updateTimerBar();
      startGlobalTimer();
    }
    function disableAllControls() {
      document.getElementById("approveBtn").disabled = true;
      document.getElementById("problemBtn").disabled = true;
      document.getElementById("submitBtn").disabled = true;
      document.querySelectorAll('.errChk').forEach(e=>e.disabled=true);
    }
    function gameOver() {
      disableAllControls();
      document.getElementById("controls").style.display = "none";
      document.getElementById("main-columns").style.opacity = 0.3;
      document.getElementById("status").textContent = "";
      stopGlobalTimer();
      let res = "", emoji = "", clas = "";
      if (scoreGood === 20) { res = "You're hired!"; emoji = "🚀"; clas = "hired";}
      else if (scoreGood >= 18) { res = "You will be considered."; emoji = "👍"; clas = "considered";}
      else { res = "Your application was rejected."; emoji = "❌"; clas = "rejected";}
      document.getElementById("endgame").innerHTML =
        `<div class="endgamebox">
          <div class="bigscore">Score: ${scoreGood} / 20</div>
          <span class="timetotal">Time: ${mmss(elapsedSec)}</span>
          <span class="result-txt ${clas}">${res} ${emoji}</span>
          <button onclick="restartGame()">Play Again</button>
        </div>`;
      document.getElementById("endgame").style.display = "";
    }
    function advance(nextFn) {
      rounds++;
      if (rounds >= MAXROUNDS) {
        setTimeout(gameOver, 777);
      } else {
        setTimeout(()=>{ pickCase(); render(); }, nextFn);
      }
    }
    function approve() {
      document.getElementById("approveBtn").disabled = true;
      document.getElementById("problemBtn").disabled = true;
      let err = gameData.errTypes;
      if (err.length===1 && err[0]==="ok") {
        scoreGood++;
        document.getElementById("status").innerHTML = `<span class="success">Correct! All payments match the invoice.</span>`;
      } else {
        scoreBad++;
        document.getElementById("status").innerHTML = `<span class="wrong">Incorrect. There is actually a problem!</span>`;
      }
      advance(1700);
    }
    function showReasonArea() {
      document.getElementById("reasonArea").style.display = "";
      setTimeout(()=>{ document.getElementById("reasonArea").style.display = "flex"; }, 0)
      document.getElementById("approveBtn").disabled = true;
      document.getElementById("problemBtn").disabled = true;
    }
    function submitReason() {
      document.getElementById("submitBtn").disabled = true;
      let checked = Array.from(document.querySelectorAll('.errChk')).filter(e=>e.checked).map(e=>e.value).sort();
      let errs = (gameData.errTypes.filter(x=>x!=="ok")).sort();
      let good = (checked.length === errs.length && checked.every((v,i)=>v===errs[i]));
      if (good) {
        scoreGood++;
        let msg = "";
        if (errs.includes("missing")) msg += "Missing payment detected. ";
        if (errs.includes("extra")) msg += "Extra check present. ";
        if (errs.includes("amount")) msg += "Wrong amount detected. ";
        if (errs.includes("tx")) msg += "Transaction number mismatch detected. ";
        if (errs.includes("combined")) msg += "A check covers multiple bills. ";
        document.getElementById("status").innerHTML = `<span class="success">Correct! ${msg}</span>`;
      } else {
        scoreBad++;
        let actual = errs.map(e=>{
          return {
            missing:    "a payment is missing.",
            extra:      "an extra check.",
            amount:     "amount error.",
            tx:         "transaction number problem.",
            combined:   "a check covers multiple bills."
          }[e];
        }).join(" | ");
        document.getElementById("status").innerHTML = `<span class="wrong">Incorrect. Actual: ${actual}</span>`;
      }
      advance(2200);
    }
    function restartGame() {
      scoreGood = 0; scoreBad = 0; rounds = 0;
      timerStarted = false; elapsedSec = 0;
      document.getElementById("endgame").style.display = "none";
      document.getElementById("main-columns").style.opacity = 1;
      document.getElementById("controls").style.display = "";
      updateTimerBar();
      pickCase(); render();
    }
    pickCase(); render();
    //Orange County Hacker caught intials F.
  </script>
</body>
