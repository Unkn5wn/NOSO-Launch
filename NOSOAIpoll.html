<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NOSO AI Poll Game</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      /* Space gradient background with twinkling stars (see .star below) */
      min-height: 100vh;
      background: radial-gradient(ellipse at 60% 20%, #23264d 40%, #13162d 95%), #000014;
      overflow-x: hidden;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      opacity: 0.77;
      pointer-events: none;
      z-index: 0;
      animation: twinkle 2.5s infinite alternate;
    }
    @keyframes twinkle {
      to { opacity: 0.4; }
    }
    .container {
      position: relative;
      max-width: 700px;
      background: rgba(35, 38, 77, 0.91);
      margin: 48px auto;
      border-radius: 16px;
      box-shadow: 0 7px 48px 10px rgba(34,31,77,0.33), 0 0px 0 2.5px #dde1ff33;
      padding: 28px 30px;
      color: #e3f2fd;
      z-index: 1;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 2px;
      color: #f3e99a;
      text-shadow: 0 0 10px #2d1341, 0 4px 32px #89cafb40;
    }
    .scorebar {
      text-align:center;
      font-size: 1.1em;
      margin: 8px 0 15px 0;
      color: #f7eba0;
      font-weight: bold;
      text-shadow: 0 2px 6px #21264f;
    }
    .timer {
      text-align: center;
      font-size: 1.2em;
      color: #edfeff;
      font-weight: bold;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px #001a30;
    }
    .grid {
      display: flex;
      gap: 40px;
      justify-content: space-evenly;
      margin-bottom: 22px;
    }
    .section {
      flex: 1 1 270px;
      background: rgba(47,63,120,0.94);
      border-radius: 12px;
      padding: 19px 17px 15px 17px;
      box-shadow: 0 0 18px #878ac733;
      border: 1.5px solid #d3e0fc19;
    }
    .section h3 {
      margin: 0 0 12px 0;
      font-size: 19px;
      color: #ffe996;
      text-shadow: 0 0px 8px #23264d77;
    }
    .field {
      margin: 7px 0;
    }
    .field span {
      display: inline-block;
      min-width: 82px;
      font-weight: bold;
      color: #ffeead;
      text-shadow: 0 0px 1.5px #11193d40;
    }
    .controls {
      text-align: center;
      margin: 25px 0 12px 0;
    }
    button {
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 1px;
      border: none;
      border-radius: 8px;
      padding: 11px 38px;
      color: #fff;
      background: linear-gradient(90deg, #3167e2 10%, #50b6f8 90%);
      margin: 7px 9px;
      cursor: pointer;
      box-shadow: 0 0 18px #3167e233, 0 0px 0.5px #e7eafd33;
      transition: background 0.18s, opacity 0.1s;
    }
    button:hover { background: linear-gradient(90deg, #445bce 10%, #298fd1 90%);}
    button:disabled { background: #6d798e; opacity: 0.5;}
    .reject-area { margin-top: 14px; }
    .status {
      text-align: center;
      font-size: 1.15em;
      margin: 16px 0 0 0;
      min-height: 32px;
      color: #ffe996;
    }
    .correct { color: #6fffc9; font-weight: bold;}
    .wrong { color: #e3e36a; background: none;}
    .footer {
      text-align: center;
      margin: 28px 0 0 0;
      color: #e5e7ff89;
      font-size: 13px;
      letter-spacing: 1px;
    }
    #reasonInput {
      padding: 5px 8px;
      width: 240px;
      border-radius: 5px;
      border: 1px solid #6b597a;
      font-size: 15px;
    }
    label[for="reasonInput"] {
      font-size: 15px;
      font-weight: normal;
      margin-right: 6px;
      color: #fffac3;
    }
    .poll-result {
      text-align: center;
      font-size: 1.25em;
      font-weight: bold;
      margin-top: 22px;
      height: 32px;
      color: #fff;
    }
    .poll-go   { background: #0adeb7; color: #212733; border-radius: 7px; display:inline-block; padding:5px 32px; box-shadow:0 2px 16px #0adeb755;}
    .poll-nogo { background: #c32c2c; border-radius: 7px; display:inline-block; padding:5px 32px;}
    .poll-hacker { background: #111; color: #ffe066; border-radius: 7px; display:inline-block; padding:5px 32px; font-family:monospace;}
    .launch-banner {
      background: #1ae45b;
      color: #212529;
      border-radius: 15px;
      margin: 38px auto 0 auto;
      font-size: 2em;
      font-weight: bold;
      text-align: center;
      padding: 28px 12px;
      box-shadow: 0 8px 30px #bdf6b8cc;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: pop-launch 0.6s;
    }
    @keyframes pop-launch {
      0% { transform: scale(0.8); opacity: 0.3;}
      60% { transform: scale(1.1); opacity:1;}
      100% { transform: scale(1.0);}
    }
  </style>
</head>
<body>
  <!-- Star field -->
  <script>
    // Create a star field with random sizes and positions, added to body
    for (let i = 0; i < 68; i++) {
      const s = document.createElement("div");
      s.className = "star";
      let size = Math.random() * 2.1 + 0.7;
      s.style.width = s.style.height = size + "px";
      s.style.top = Math.random() * 98 + "vh";
      s.style.left = Math.random() * 99 + "vw";
      s.style.opacity = Math.random()*0.5+0.5;
      s.style.animationDelay = (Math.random()*2.5)+"s";
      document.body.appendChild(s);
    }
  </script>
  <div class="container" id="mainContainer">
    <h1>NOSO AI Poll Check Game</h1>
    <div class="scorebar">
      Go: <span id="approvedCount">0</span>
      &nbsp;|&nbsp;
      No-Go: <span id="rejectedCount">0</span>
      &nbsp;|&nbsp;
      Internal Error: <span id="missedCount">0</span>
    </div>
    <div class="timer">
      Time Left: <span id="timerValue">15</span> seconds
    </div>
    <div class="grid">
      <div class="section">
        <h3>Employee Record</h3>
        <div class="field"><span>Name:</span> <span id="voter-name"></span></div>
        <div class="field"><span>Age:</span> <span id="voter-age"></span></div>
        <div class="field"><span>Address:</span> <span id="voter-address"></span></div>
        <div class="field"><span>ID#:</span> <span id="voter-id"></span></div>
      </div>
      <div class="section">
        <h3>Go or No-Go Poll Check</h3>
        <div class="field"><span>Name:</span> <span id="ballot-name"></span></div>
        <div class="field"><span>Age:</span> <span id="ballot-age"></span></div>
        <div class="field"><span>Address:</span> <span id="ballot-address"></span></div>
        <div class="field"><span>ID#:</span> <span id="ballot-id"></span></div>
      </div>
    </div>
    <div class="controls">
      <button onclick="approve()" id="approveBtn">Approve (Go)</button>
      <button onclick="showReject()" id="rejectBtn">Reject (No-Go)</button>
      <span id="rejectArea" class="reject-area" style="display:none;">
        <label for="reasonInput">Enter reason(s) for No-Go (e.g. "Name", "Address"):</label>
        <input type="text" id="reasonInput" autocomplete="off" />
        <button onclick="reject()" id="confirmRejectBtn">Confirm No-Go</button>
      </span>
    </div>
    <div class="status" id="status"></div>
    <div class="poll-result" id="pollResult"></div>
    <div class="footer">Game by Copilot &amp; Unkn5wn</div>
  </div>
  <div id="launchBanner" style="display:none;"></div>
  <script>
    const voter_examples = [
      {name:"Emma Reed", age:32, address:"201 Main Ave", id:"4568719"},
      {name:"Jacob Lee", age:26, address:"718 Aspen Rd", id:"8823415"},
      {name:"Sophia Gomez", age:45, address:"915 Center St", id:"9082374"},
      {name:"Mason Clarke", age:40, address:"1100 Bay Dr", id:"6012317"},
      {name:"Ava Patel", age:28, address:"330 River Way", id:"2178932"},
      {name:"Daniel Miller", age:55, address:"840 Willow Ln", id:"9143281"},
    ];
    let voter, ballot, realDiff = {};
    let approved = 0, rejected = 0, missed = 0, goPolls = 0;
    let timer = null, timeLeft = 15;
    const timerValueSpan = document.getElementById("timerValue");
    const approveBtn = document.getElementById("approveBtn");
    const rejectBtn = document.getElementById("rejectBtn");
    const confirmRejectBtn = document.getElementById("confirmRejectBtn");
    const pollResultDiv = document.getElementById('pollResult');
    const mainContainer = document.getElementById('mainContainer');
    const launchBanner = document.getElementById('launchBanner');
    function updateScorebar() {
      document.getElementById("approvedCount").textContent = approved;
      document.getElementById("rejectedCount").textContent = rejected;
      document.getElementById("missedCount").textContent = missed;
    }
    function clearPollResult() { pollResultDiv.innerHTML = ""; }
    function startTimer() {
      clearInterval(timer);
      timeLeft = 15;
      timerValueSpan.textContent = timeLeft;
      timer = setInterval(() => {
        timeLeft--;
        timerValueSpan.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          showTimeout();
        }
      }, 1000);
    }
    function disableInputs(disabled=true) {
      approveBtn.disabled = disabled;
      rejectBtn.disabled = disabled;
      confirmRejectBtn.disabled = disabled;
      document.getElementById("reasonInput").disabled = disabled;
    }
    function showTimeout() {
      disableInputs(true);
      document.getElementById('status').innerHTML = `<span class="wrong">Internal Error! You missed this poll check.</span>`;
      pollResultDiv.innerHTML = `<span class="poll-hacker">Hacker Found</span>`;
      missed++;
      updateScorebar();
      setTimeout(()=>{ clearPollResult(); gen(); },2000);
    }
    function displayLaunchBanner() {
      mainContainer.style.display = "none";
      launchBanner.innerHTML = `<div class="launch-banner">
        🚀 Successful Launch! <br>
        Congratulations, you approved 15 Go Polls!<br>
        <span style="font-size:1rem;color:#333">(Game will restart...)</span>
      </div>`;
      launchBanner.style.display = "";
      setTimeout(restartGame, 5000);
    }
    function restartGame() {
      launchBanner.style.display = "none";
      approved = rejected = missed = goPolls = 0;
      updateScorebar();
      mainContainer.style.display = "";
      gen();
    }
    function gen() {
      document.getElementById("rejectArea").style.display="none";
      document.getElementById("reasonInput").value = "";
      voter = voter_examples[Math.floor(Math.random()*voter_examples.length)];
      ballot = randomBallotFrom(voter);
      document.getElementById('voter-name').textContent = voter.name;
      document.getElementById('voter-age').textContent = voter.age;
      document.getElementById('voter-address').textContent = voter.address;
      document.getElementById('voter-id').textContent = voter.id;
      document.getElementById('ballot-name').textContent = ballot.name;
      document.getElementById('ballot-age').textContent = ballot.age;
      document.getElementById('ballot-address').textContent = ballot.address;
      document.getElementById('ballot-id').textContent = ballot.id;
      document.getElementById('status').textContent = "";
      clearPollResult();
      // Compute real diff (but not spacefield - always matches)
      realDiff = {};
      if (voter.name !== ballot.name) realDiff.name=true;
      if (voter.age !== ballot.age) realDiff.age=true;
      if (voter.address !== ballot.address) realDiff.address=true;
      if (voter.id !== ballot.id) realDiff.id=true;
      updateScorebar();
      disableInputs(false);
      startTimer();
    }
    function randomBallotFrom(voter) {
      let ballot = {...voter};
      if (Math.random() < 0.3) ballot.name = ballot.name.split(' ')[1] + " " + ballot.name.split(' ')[0];
      if (Math.random() < 0.3) ballot.age = ballot.age + (Math.random()<0.5?1:-1);
      if (Math.random() < 0.3) ballot.address = (ballot.address.match(/\d+/)[0]-1) + " " + ballot.address.replace(/^\d+\s/,"");
      if (Math.random() < 0.3) ballot.id = String(Number(ballot.id) + (Math.random()<0.5?1:-1));
      return ballot;
    }
    function approve() {
      clearInterval(timer);
      disableInputs(true);
      clearPollResult();
      if (Object.keys(realDiff).length === 0) {
        approved++;
        goPolls++;
        document.getElementById('status').innerHTML = '<span class="correct">Correct! GO - All clear. ✔️</span>';
        pollResultDiv.innerHTML = '<span class="poll-go">Go Poll</span>';
        updateScorebar();
        if (goPolls >= 15) {
          setTimeout(displayLaunchBanner, 1100);
        } else {
          setTimeout(()=>{ clearPollResult(); gen(); }, 1100);
        }
      } else {
        let wrongs = Object.keys(realDiff).map(k=>k.charAt(0).toUpperCase()+k.slice(1)).join(", ");
        document.getElementById('status').innerHTML =
          `<span class="wrong">Incorrect. No-Go - Mismatched field(s): ${wrongs}.</span>`;
        setTimeout(()=>{ clearPollResult(); gen(); }, 2100);
      }
    }
    function showReject() {
      document.getElementById("rejectArea").style.display='';
      document.getElementById("reasonInput").focus();
    }
    function reject() {
      clearInterval(timer);
      disableInputs(true);
      clearPollResult();
      let input = document.getElementById('reasonInput').value.trim().toLowerCase();
      let entered = input.split(/[^a-z]+/).filter(Boolean);
      let real = Object.keys(realDiff);
      let matched = real.filter(fld => entered.includes(fld));
      let missedF = real.filter(fld => !entered.includes(fld));
      let extra = entered.filter(fld => !real.includes(fld));
      if (real.length === 0 && entered.length === 0) {
        document.getElementById('status').innerHTML = '<span class="correct">Correct! GO - No issues. ✔️</span>';
        pollResultDiv.innerHTML = '<span class="poll-go">Go Poll</span>';
        goPolls++;
        approved++;
        updateScorebar();
        if (goPolls >= 15) {
          setTimeout(displayLaunchBanner, 1100);
        } else {
          setTimeout(()=>{ clearPollResult(); gen(); }, 1100);
        }
      } else if (missedF.length === 0 && extra.length === 0 && matched.length === real.length && entered.length === real.length) {
        rejected++;
        document.getElementById('status').innerHTML = `<span class="correct">Correct! NO-GO for: ${real.map(f=>f.charAt(0).toUpperCase()+f.slice(1)).join(", ")}.</span>`;
        pollResultDiv.innerHTML = '<span class="poll-nogo">No-Go Poll</span>';
        updateScorebar();
        setTimeout(()=>{ clearPollResult(); gen(); }, 2500);
      } else {
        let realStr = real.length ? real.map(f=>f.charAt(0).toUpperCase()+f.slice(1)).join(", ") : "none";
        document.getElementById('status').innerHTML = `<span class="wrong">Incorrect. Actual issue(s): ${realStr}.</span>`;
        setTimeout(()=>{ clearPollResult(); gen(); }, 2500);
      }
    }
    gen();
  </script>
</body>
</html>
