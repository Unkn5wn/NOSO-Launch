<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rocket Fuel Selector</title>
  <style>
    body {
      background: linear-gradient(#222948, #7AB6EC);
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 40px;
      position: relative;
      z-index: 1;
    }
    .rocket-emoji-container {
      width: 110px;
      height: 200px;
      margin: 40px auto 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rocket-emoji {
      font-size: 80px;
      line-height: 1;
      transition: transform 2s;
      display: inline-block;
    }
    .fuel-options {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 32px auto;
      flex-wrap: wrap;
    }
    .fuel-btn {
      background: #333a60;
      border: none;
      color: #fff;
      padding: 16px 28px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 2px 7px #0004;
    }
    .fuel-btn:hover {
      background: #4e96df;
      transform: scale(1.08);
    }
    .message {
      font-size: 1.3rem;
      min-height: 40px;
      margin-top: 20px;
    }
    .fact {
      font-size: 1rem;
      margin-top: 8px;
      color: #ffee9c;
      margin-bottom: 6px;
      min-height: 10px;
    }
    .launch {
      animation: rocket-launch-emoji 2s forwards;
    }
    @keyframes rocket-launch-emoji {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-230px) scale(1.1);}
    }
    .fail {
      animation: rocket-fail-emoji 1.2s forwards;
    }
    @keyframes rocket-fail-emoji {
      0%   { transform: rotate(0deg); }
      35%  { transform: rotate(-8deg) translateY(10px);}
      65%  { transform: rotate(8deg) translateY(22px);}
      100% { transform: rotate(-25deg) translateY(37px) scale(1.05);}
    }
    .reset-btn {
      margin-top: 24px;
      padding: 11px 19px;
      background: #f8d34d;
      color: #232323;
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      cursor: pointer;
      display: none;
    }
    /* Bubble Shooter */
    .minigame-area {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      width: 420px;
      height: 530px;
      transform: translate(-50%, -53%);
      background: #23274c;
      box-shadow: 0 4px 32px #0006;
      border-radius: 12px;
      z-index: 20;
      border: 3px solid #4e96df;
    }
    #bubble-canvas {
      width: 420px;
      height: 530px;
      border-radius: 12px;
      background: transparent;
      z-index: 21;
      display: block;
      margin: 0;
    }
    #score-bar {
      display: none;
      position: absolute;
      left: 80px;
      bottom: 18px;
      transform: translateX(-50%);
      background: #37447cda;
      color: #fff;
      padding: 8px 30px;
      font-size: 1.35rem;
      border-radius: 8px;
      z-index: 35;
      user-select: none;
      font-weight: bold;
      box-shadow: 0 2px 8px #0003;
    }
    #exit-minigame {
      display: none;
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 33;
      font-size: 1.05rem;
      color: #212954;
      background: #f8d34d;
      border: none;
      border-radius: 5px;
      padding: 7px 15px;
      cursor: pointer;
    }
    #minigame-msg {
      display: none;
      position: absolute;
      left: 50%;
      top: 25%;
      transform: translate(-50%, -40%);
      background: #212954ee;
      color: #fff;
      padding: 20px 36px;
      border-radius: 14px;
      font-size: 1.3rem;
      z-index: 30;
      box-shadow: 0 0 14px #0004;
    }
    @media (max-width: 700px) {
      .minigame-area,
      #bubble-canvas {
        width: 98vw !important;
        height: 60vw !important;
        min-width:260px; max-width:100vw; min-height:140px; max-height:80vw;
      }
      #score-bar {
        bottom: 15px;
        font-size:1.07rem;
        padding:4px 12px;
      }
      #exit-minigame {
        right: 9px;
        bottom: 9px;
        font-size: 0.97rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Rocket Fuel Selector 🚀</h1>
    <div id="mission"></div>
    <div class="fact" id="fact"></div>
    <div class="rocket-emoji-container">
      <span id="rocket" class="rocket-emoji" role="img" aria-label="rocket">🚀</span>
    </div>
    <div class="fuel-options" id="fuel-options"></div>
    <div id="message" class="message"></div>
    <button id="reset-btn" class="reset-btn">Play Again</button>
  </div>
  <!-- Minigame overlay area -->
  <div class="minigame-area" id="minigame-area">
    <canvas id="bubble-canvas" width="420" height="530"></canvas>
    <div id="score-bar">Score: 0</div>
    <button id="exit-minigame">Exit Minigame</button>
    <div id="minigame-msg"></div>
  </div>
  <!-- Poof pop sound (17ms mono wav, inlined) -->
  <audio id="poof-sound" src="data:audio/wav;base64,UklGRpABAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YYABAAD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD+/P5FNPbZrBfexC2ZG1lfNHh6XMOfnHP7BAAA/wD/AP8A/w==" preload="auto"></audio>
  <script>
    // --------- Rocket Game Code ---------
    const missions = [
      {
        title: "Mission to the Moon",
        fact: "Most Moon rockets (like Saturn V) used Liquid Hydrogen and Liquid Oxygen.",
        correct: "Liquid Hydrogen (LH2)",
        fuels: ["Liquid Hydrogen (LH2)", "Diesel", "Tap Water", "Soy Sauce"]
      },
      {
        title: "Journey to Mars",
        fact: "Methalox (liquid methane + liquid oxygen) is favored for Mars missions, like on Starship.",
        correct: "Methalox",
        fuels: ["Methalox", "Car Battery", "Nitroglycerin", "Fruit Juice"]
      },
      {
        title: "Low Earth Orbit Satellite Launch",
        fact: "Soyuz and Falcon 9 use RP-1 (refined kerosene) and liquid oxygen.",
        correct: "RP-1 (Rocket Propellant-1)",
        fuels: ["RP-1 (Rocket Propellant-1)", "Diesel", "Unleaded Gasoline", "Cooking Oil"]
      },
      {
        title: "Launching the Space Shuttle",
        fact: "The shuttle's main engines burned Liquid Hydrogen and Oxygen; boosters used solid fuel.",
        correct: "Liquid Hydrogen and Oxygen",
        fuels: [
          "Liquid Hydrogen and Oxygen",
          "Propane",
          "Olive Oil",
          "Liquid Nitrogen"
        ]
      },
      {
        title: "Satellite Reposition in Space",
        fact: "Hydrazine is a common satellite maneuvering propellant.",
        correct: "Hydrazine",
        fuels: [
          "Hydrazine", "Vinegar", "Ethanol", "Liquid Argon"
        ]
      },
      {
        title: "Mars Rover Descent Thruster",
        fact: "MMH/N2O4 (Monomethylhydrazine and Nitrogen Tetroxide) are storable propellants, ideal for Mars landers.",
        correct: "Monomethylhydrazine (MMH) and Nitrogen Tetroxide (N2O4)",
        fuels: [
          "Monomethylhydrazine (MMH) and Nitrogen Tetroxide (N2O4)",
          "Diesel & Air",
          "Liquid Neon",
          "Club Soda"
        ]
      },
      {
        title: "High Altitude Sounding Rocket",
        fact: "Some sounding rockets use Solid Propellant for simplicity.",
        correct: "Solid Propellant",
        fuels: [
          "Solid Propellant", "Liquid Ammonia", "Plastic Pellets", "Cola"
        ]
      },
      {
        title: "SpaceX Starship Test Flight",
        fact: "Starship uses Methalox engines (liquid methane + liquid oxygen).",
        correct: "Methalox",
        fuels: [
          "Methalox", "Diesel-Glycerin", "Peanut Butter", "Aluminum Powder"
        ]
      }
    ];

    let currentMission = {};
    function pickMission() {
      currentMission = missions[Math.floor(Math.random() * missions.length)];
      document.getElementById('mission').textContent = currentMission.title;
      document.getElementById('fact').textContent = currentMission.fact || "";
      renderFuelChoices();
      document.getElementById('message').textContent = "";
      document.getElementById('rocket').className = 'rocket-emoji';
      document.getElementById('reset-btn').style.display = "none";
    }

    function renderFuelChoices() {
      const container = document.getElementById('fuel-options');
      container.innerHTML = "";
      currentMission.fuels
        .map(fuel => ({fuel, rand: Math.random()}))
        .sort((a,b) => a.rand - b.rand)
        .forEach(obj => {
          const btn = document.createElement('button');
          btn.textContent = obj.fuel;
          btn.className = 'fuel-btn';
          btn.onclick = () => selectFuel(obj.fuel);
          container.appendChild(btn);
        });
    }

    function selectFuel(fuel) {
      const correct = fuel === currentMission.correct;
      document.querySelectorAll('.fuel-btn').forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === currentMission.correct) {
          btn.style.background = "#33d17a";
        } else if (btn.textContent === fuel && !correct) {
          btn.style.background = "#e75a5a";
        }
      });
      const rocket = document.getElementById('rocket');
      const message = document.getElementById('message');
      if (correct) {
        rocket.className = "rocket-emoji launch";
        message.textContent = "Success! The rocket launches! Prepare for Stage 2...";
        setTimeout(() => { startBubbleShooterMinigame(); }, 1250);
      } else {
        rocket.className = "rocket-emoji fail";
        message.textContent = "Oops! Wrong fuel... The rocket fails to launch.";
        document.getElementById('reset-btn').style.display = "inline-block";
      }
    }
    document.getElementById('reset-btn').onclick = pickMission;
    pickMission();

    // --------- Bubble Shooter Minigame Code ---------
    const minigameArea = document.getElementById('minigame-area');
    const canvas = document.getElementById('bubble-canvas');
    const ctx = canvas.getContext('2d');
    const CANVAS_W = canvas.width;
    const CANVAS_H = canvas.height;
    const ROWS = 7, COLS = 9;
    const CELL_W = CANVAS_W/(COLS+0.1), CELL_H = 1.08*(CANVAS_H/ROWS)/1.5;
    const BUBBLE_R = 24;
    const SHOOT_SPEED = 7.6;
    const COLORS = ['#ffa85c', '#58faed', '#ff5967', '#fde65e', '#a586fe', '#7efa74'];
    const POWERS = [null, null, null, null, 'bomb','rainbow'];
    const POWER_ICONS = { bomb: "B", rainbow: "★" };

    let bubbleGrid = [], shooterBubble, shooterX, shooterDX, shooterDY, playing = false, gameOver = false, bubblesLeft = 0;
    let aimTarget = {x: CANVAS_W/2, y: CANVAS_H/3};
    let score = 0;
    const minigameMsg = document.getElementById('minigame-msg');
    const exitMinigameBtn = document.getElementById('exit-minigame');
    const scoreBar = document.getElementById('score-bar');
    const poofSound = document.getElementById('poof-sound');

    function startBubbleShooterMinigame() {
      minigameArea.style.display = "block";
      canvas.style.display = "block";
      minigameMsg.style.display = "none";
      exitMinigameBtn.style.display = "inline";
      scoreBar.style.display = "block";
      score = 0;
      updateScore(0);
      document.querySelectorAll('.container > *:not(#minigame-area)').forEach(el=>{
        if (el!==minigameArea) el.style.visibility = "hidden";
      });
      document.body.style.overflow = "hidden";
      bubbleGrid = [];
      for (let r=0;r<ROWS;++r) {
        bubbleGrid[r] = [];
        for (let c=0;c<COLS;++c) {
          let filled = r < 3 ? Math.random() < 0.92 :
                       r < ROWS-1 ? Math.random() < 0.7 : Math.random() < 0.32;
          bubbleGrid[r][c] = filled ?
            { color: COLORS[Math.floor(Math.random()*COLORS.length)], power:null } : null;
        }
      }
      updateBubblesLeft();
      spawnShooter();
      gameOver = false;
      playing = true;
      aimTarget = { x: CANVAS_W/2, y: CANVAS_H/3 };
      drawMinigame();
    }

    function updateBubblesLeft() {
      bubblesLeft = 0;
      for (let r=0;r<ROWS;++r)
        for (let c=0;c<COLS;++c)
          if (bubbleGrid[r][c]) bubblesLeft++;
    }

    function randomPower() {
      let pick = POWERS[Math.floor(Math.random()*POWERS.length)];
      return pick || null;
    }
    function spawnShooter() {
      shooterX = CANVAS_W/2;
      shooterDX = shooterDY = 0;
      let power = randomPower();
      let color = power === "rainbow" ? "#fff" : COLORS[Math.floor(Math.random()*COLORS.length)];
      shooterBubble = {
        color,
        x: shooterX,
        y: CANVAS_H - BUBBLE_R - 8,
        moving: false,
        power: power
      };
    }
    function shootBubbleAt(mx, my) {
      let dx = mx - shooterX;
      let dy = my - (CANVAS_H - BUBBLE_R - 8);
      let angle = Math.atan2(dy, dx);
      const MIN_AIM = -Math.PI*0.92;
      const MAX_AIM = Math.PI*0.92;
      if (angle < MIN_AIM) angle = MIN_AIM;
      if (angle > MAX_AIM) angle = MAX_AIM;
      if (Math.abs(angle) < Math.PI/7) angle = angle<0 ? -Math.PI/7 : Math.PI/7;
      if (angle > Math.PI - Math.PI/6) angle = Math.PI - Math.PI/6;
      if (angle < -Math.PI + Math.PI/6) angle = -Math.PI + Math.PI/6;
      shooterDX = SHOOT_SPEED * Math.cos(angle);
      shooterDY = SHOOT_SPEED * Math.sin(angle);
      shooterBubble.moving = true;
    }

    function gridToXY(r, c) {
      let x = (c + 0.5 + (r%2)*0.5) * CELL_W;
      let y = (r+0.5) * (BUBBLE_R*1.2);
      return [x, y];
    }
    function drawMinigame() {
      ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
      scoreBar.textContent = "Score: " + score;
      for (let r=0;r<ROWS;++r) for (let c=0;c<COLS;++c) {
        let b = bubbleGrid[r][c];
        if (b) {
          let [x, y] = gridToXY(r, c);
          drawBubble(x, y, BUBBLE_R, b.color, false, b.power);
        }
      }
      if (!shooterBubble.moving && playing) drawAimLine();
      if (shooterBubble) 
        drawBubble(shooterBubble.x, shooterBubble.y, BUBBLE_R, shooterBubble.color, true, shooterBubble.power);
      if (!gameOver && playing)
        requestAnimationFrame(drawMinigame);
    }
    function drawBubble(x, y, r, color, outline, power) {
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.fillStyle = color;
      ctx.shadowBlur = 7;
      ctx.shadowColor = "#222";
      ctx.fill();
      if (outline) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#fff";
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(x-r/4, y-r/4, r/2.4, Math.PI, Math.PI*2);
      ctx.globalAlpha = 0.19;
      ctx.fillStyle = "#fff";
      ctx.fill();
      if (power === "bomb" || power === "rainbow") {
        ctx.globalAlpha = 1;
        ctx.font = "bold 22px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = power === "bomb" ? "#222" : "#ffde38";
        ctx.fillText(POWER_ICONS[power], x, y);
        if (power === "rainbow") {
          ctx.beginPath();
          ctx.arc(x, y, r-8, 0, Math.PI*2);
          ctx.strokeStyle = "#fde700";
          ctx.lineWidth = 2.5;
          ctx.globalAlpha = 0.5;
          ctx.stroke();
        }
      }
      ctx.restore();
    }
    function drawAimLine() {
      ctx.save();
      ctx.globalAlpha = 0.26;
      ctx.strokeStyle = "#ffe884";
      ctx.setLineDash([9,6]);
      ctx.lineWidth = 5;
      let path = getAimPath(shooterX, CANVAS_H - BUBBLE_R - 8, aimTarget.x, aimTarget.y);
      ctx.beginPath();
      ctx.moveTo(path[0].x, path[0].y);
      for (let pt of path.slice(1)) ctx.lineTo(pt.x, pt.y);
      ctx.stroke();
      ctx.restore();
    }
    function getAimPath(sx, sy, tx, ty) {
      let pts = [{x:sx, y:sy}];
      let dx = tx - sx;
      let dy = ty - sy;
      let angle = Math.atan2(dy, dx);
      const MIN_AIM = -Math.PI*0.92;
      const MAX_AIM = Math.PI*0.92;
      if (angle < MIN_AIM) angle = MIN_AIM;
      if (angle > MAX_AIM) angle = MAX_AIM;
      if (Math.abs(angle) < Math.PI/7) angle = angle<0 ? -Math.PI/7 : Math.PI/7;
      if (angle > Math.PI - Math.PI/6) angle = Math.PI - Math.PI/6;
      if (angle < -Math.PI + Math.PI/6) angle = -Math.PI + Math.PI/6;
      dx = Math.cos(angle);
      dy = Math.sin(angle);
      let px = sx, py = sy, vx = dx, vy = dy;
      for (let bounce = 0; bounce < 3; ++bounce) {
        let tWall;
        if (vx < 0)
          tWall = (BUBBLE_R - px)/vx;
        else
          tWall = (CANVAS_W - BUBBLE_R - px)/vx;
        let tTop = (BUBBLE_R - py)/vy;
        let t = tTop;
        let hitWall = false;
        if (tWall > 0 && tWall < tTop) {
          t = tWall;
          hitWall = true;
        }
        let nx = px+vx*t, ny = py+vy*t;
        pts.push({x:nx, y:ny});
        if (!hitWall) break;
        vx *= -1;
        px = nx; py = ny;
      }
      return pts;
    }
    function updateScore(add) {
      score += add;
      scoreBar.textContent = "Score: " + score;
    }
    function playPoof() {
      try {
        poofSound.currentTime = 0;
        poofSound.play();
      } catch {}
    }
    function updateMinigame() {
      if (!playing || !shooterBubble || !shooterBubble.moving) return;
      shooterBubble.x += shooterDX;
      shooterBubble.y += shooterDY;
      if (shooterBubble.x < BUBBLE_R || shooterBubble.x > (CANVAS_W-BUBBLE_R)) {
        shooterDX *= -1;
        shooterBubble.x = Math.max(BUBBLE_R, Math.min(CANVAS_W-BUBBLE_R, shooterBubble.x));
      }
      if (shooterBubble.y < BUBBLE_R+2) {
        let [row, col] = findClosestCell(shooterBubble.x, shooterBubble.y);
        placeShooterBubble(row, col);
        return;
      }
      let hit = false;
      for (let r=0;r<ROWS;++r) for (let c=0;c<COLS;++c) {
        let b = bubbleGrid[r][c];
        if (!b) continue;
        let [cx, cy] = gridToXY(r, c);
        if (Math.hypot(cx-shooterBubble.x, cy-shooterBubble.y) < BUBBLE_R*1.5) {
          let [rr, cc] = findClosestEmptyNeighbor(r, c);
          if (rr == null) [rr,cc] = [r,c];
          placeShooterBubble(rr, cc);
          hit = true;
          break;
        }
      }
      if (!hit) requestAnimationFrame(updateMinigame);
    }
    function findClosestCell(x, y) {
      let minD = 1e9, res = [0,0];
      for (let r=0;r<ROWS;++r) for (let c=0;c<COLS;++c) {
        let [cx, cy] = gridToXY(r,c);
        let d = Math.hypot(x-cx,y-cy);
        if (d < minD) {
          minD = d; res = [r,c];
        }
      }
      return res;
    }
    function findClosestEmptyNeighbor(r, c) {
      let possibilities = [];
      for (let [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1],[-1,1],[1,-1]]) {
        let rr = r+dr, cc = c+dc;
        if (rr<0||rr>=ROWS||cc<0||cc>=COLS) continue;
        if (!bubbleGrid[rr][cc]) possibilities.push([rr,cc]);
      }
      return possibilities.length ? possibilities[0] : [null,null];
    }
    function placeShooterBubble(row, col) {
      if (row >= ROWS) row = ROWS-1;
      if (col < 0) col = 0; if (col >= COLS) col = COLS-1;
      for (let rr=row; rr>=0; --rr)
        if (!bubbleGrid[rr][col]) { row = rr; break; }
      let power = shooterBubble.power || null;
      let color = shooterBubble.color;
      let baseScore = 100;
      let didPop = false, chain = 0;
      if (power === "bomb") {
        for (let dr=-1; dr<=1; ++dr)
          for (let dc=-1; dc<=1; ++dc) {
            let rr=row+dr, cc=col+dc;
            if (rr<0||rr>=ROWS||cc<0||cc>=COLS) continue;
            if (bubbleGrid[rr][cc]) {
              bubbleGrid[rr][cc]=null;
              updateScore(baseScore);
              chain++;
              didPop = true;
            }
          }
        playPoof();
      } else if (power === "rainbow") {
        let maxGroup = [], bestColor = null;
        for (let candidateColor of COLORS) {
          let test = popMatchingBubblesSim(row, col, candidateColor);
          if (test.length > maxGroup.length) {
            maxGroup = test, bestColor = candidateColor;
          }
        }
        if (maxGroup.length >= 3) {
          for (let [rr,cc] of maxGroup) bubbleGrid[rr][cc]=null;
          didPop = true; chain = maxGroup.length;
          updateScore(chain*baseScore*2);
          playPoof();
        } else {
          bubbleGrid[row][col] = { color: COLORS[Math.floor(Math.random()*COLORS.length)], power: null };
        }
      } else {
        bubbleGrid[row][col] = { color, power:null };
        let popped = popMatchingBubbles(row, col);
        if (popped.length >= 3) {
          for (let [rr,cc] of popped) bubbleGrid[rr][cc]=null;
          updateScore(popped.length*baseScore);
          didPop = true; chain=popped.length;
          playPoof();
        }
      }
      shooterBubble = null;
      updateBubblesLeft();
      if (bubblesLeft === 0) { minigameWin(); }
      else { spawnShooter(); drawMinigame(); }
    }
    function popMatchingBubblesSim(r, c, color) {
      let group = [];
      let queue = [[r,c]];
      let visited = Array.from({length:ROWS},_=>Array(COLS).fill(false));
      while (queue.length) {
        let [rr, cc] = queue.pop();
        if (rr<0||rr>=ROWS||cc<0||cc>=COLS||visited[rr][cc]) continue;
        let b = bubbleGrid[rr][cc];
        if (!b || b.color !== color) continue;
        group.push([rr,cc]);
        visited[rr][cc] = true;
        for (let [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1],[-1,1],[1,-1]]) {
          queue.push([rr+dr, cc+dc]);
        }
      }
      return group;
    }
    function popMatchingBubbles(r, c) {
      let color = bubbleGrid[r][c].color;
      let group = [];
      let queue = [[r,c]];
      let visited = Array.from({length:ROWS},_=>Array(COLS).fill(false));
      while (queue.length) {
        let [rr, cc] = queue.pop();
        if (rr<0||rr>=ROWS||cc<0||cc>=COLS||visited[rr][cc]) continue;
        let b = bubbleGrid[rr][cc];
        if (!b || b.color !== color) continue;
        group.push([rr,cc]);
        visited[rr][cc] = true;
        for (let [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1],[-1,1],[1,-1]]) {
          queue.push([rr+dr, cc+dc]);
        }
      }
      return group;
    }
    function minigameWin() {
      playing = false;
      minigameMsg.textContent = '🟢 Bubbles Cleared! You win! Final Score: '+score;
      minigameMsg.style.display = "block";
      exitMinigameBtn.style.display = "inline";
      scoreBar.style.display = "block";
    }
    function minigameExit() {
      minigameArea.style.display = "none";
      canvas.style.display = "none";
      minigameMsg.style.display = "none";
      exitMinigameBtn.style.display = "none";
      scoreBar.style.display = "none";
      document.body.style.overflow = "";
      document.querySelectorAll('.container > *:not(#minigame-area)').forEach(el=>{
        if (el!==minigameArea) el.style.visibility = "";
      });
      document.getElementById('reset-btn').style.display = "inline-block";
    }
    canvas.addEventListener('mousemove', function(evt){
      if (!shooterBubble || shooterBubble.moving) return;
      const rect = canvas.getBoundingClientRect();
      const mx = evt.clientX - rect.left, my = evt.clientY - rect.top;
      if (my < (CANVAS_H - 30)) aimTarget = { x: mx, y: my };
    });
    canvas.addEventListener('mousedown', function(evt){
      if (!shooterBubble || !playing || shooterBubble.moving) return;
      const rect = canvas.getBoundingClientRect();
      const mx = evt.clientX - rect.left, my = evt.clientY - rect.top;
      if (my < CANVAS_H - 70)
        shootBubbleAt(mx,my), requestAnimationFrame(updateMinigame);
    });
    let lastTouch = null;
    canvas.addEventListener('touchmove', function(evt){
      if (!shooterBubble || shooterBubble.moving) return;
      const rect = canvas.getBoundingClientRect();
      const touch = evt.touches[0];
      const mx = touch.clientX - rect.left, my = touch.clientY - rect.top;
      if (my < (CANVAS_H - 30)) aimTarget = { x: mx, y: my };
      lastTouch = {mx, my};
    });
    canvas.addEventListener('touchstart', function(evt){
      if (!shooterBubble || !playing || shooterBubble.moving) return;
      const rect = canvas.getBoundingClientRect();
      const touch = evt.touches[0];
      const mx = touch.clientX - rect.left, my = touch.clientY - rect.top;
      if (my < CANVAS_H - 70)
        shootBubbleAt(mx,my), requestAnimationFrame(updateMinigame);
    });
    exitMinigameBtn.onclick = minigameExit;
    window.addEventListener('keydown', (e) => {
      if (minigameArea.style.display === "block" && (e.key === "Escape" || e.key === "Esc")) {
        minigameExit();
      }
    });
  </script>
