<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NOSO Sequencer Memory Lights Game</title>
  <style>
    body {
      background: #212529;
      color: #f8f9fa;
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    h1 {
      margin-top: 40px;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }
    .game-board {
      margin: 40px auto;
      width: 330px;
      display: grid;
      grid-template-columns: 150px 150px;
      grid-gap: 30px;
      justify-content: center;
    }
    .btn-light {
      width: 150px;
      height: 150px;
      border: 6px solid #333;
      border-radius: 24px;
      background: #222;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.1s, box-shadow 0.1s;
      font-size: 0;
    }
    .btn-light.active { opacity: 1; box-shadow: 0 0 50px 8px #fff; }
    .btn-green   { background: #28a745; }
    .btn-red     { background: #dc3545; }
    .btn-yellow  { background: #ffc107; }
    .btn-blue    { background: #007bff; }
    .stats, .controls {
      margin: 16px;
      font-size: 20px;
    }
    .message {
      font-size: 22px;
      margin: 12px 0 24px 0;
      min-height: 28px;
      color: #ffe082;
      text-shadow: 1px 1px 2px #000;
    }
    button#start {
      font-size: 18px;
      padding: 12px 30px;
      border-radius: 8px;
      background: linear-gradient(90deg,#0099ff 40%,#1ae59f 100%);
      color: #212529;
      border: none;
      margin: 18px 0;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 2px;
    }
    button#start:hover { background: linear-gradient(90deg,#007add 40%,#16ce87 100%);}
  </style>
</head>
<body>
  <h1>NOSO Sequencer Memory Lights Game</h1>
  <div class="message" id="message"></div>
  <div class="game-board">
    <button class="btn-light btn-green"   id="btn-0"></button>
    <button class="btn-light btn-red"     id="btn-1"></button>
    <button class="btn-light btn-yellow"  id="btn-2"></button>
    <button class="btn-light btn-blue"    id="btn-3"></button>
  </div>
  <div class="stats">
    Level: <span id="level">0</span>
  </div>
  <div class="controls">
    <button id="start">Start New Game</button>
  </div>
  <script>
    // Core variables
    let sequence = [];
    let userStep = 0;
    let level = 0;
    let strict = false;
    let isPlayingBack = false;
    const colors = ['green','red','yellow','blue'];

    // DOM elements
    const btns = [
      document.getElementById('btn-0'),
      document.getElementById('btn-1'),
      document.getElementById('btn-2'),
      document.getElementById('btn-3')
    ];
    const message = document.getElementById('message');
    const levelText = document.getElementById('level');
    const startBtn = document.getElementById('start');

    // Light up one button for duration
    function activateButton(idx, duration = 500) {
      btns[idx].classList.add('active');
      setTimeout(() => btns[idx].classList.remove('active'), duration);
    }

    // Play sequence so far
    async function playSequence() {
      isPlayingBack = true;
      for (let i=0; i<sequence.length; ++i) {
        activateButton(sequence[i]);
        await new Promise(r => setTimeout(r, 700));
      }
      isPlayingBack = false;
    }
    // Start next round
    async function nextRound() {
      level++;
      levelText.textContent = level;
      userStep = 0;
      const next = Math.floor(Math.random()*4);
      sequence.push(next);
      message.textContent = 'Watch the sequence...';
      await playSequence();
      message.textContent = "Now it's your turn!";
    }
    // Reset everything
    function resetGame() {
      sequence = [];
      userStep = 0;
      level = 0;
      levelText.textContent = "0";
      message.textContent = "Press Start to play!";
    }
    // Handle user's clicks
    function userClick(idx) {
      if (isPlayingBack || sequence.length===0) return;
      activateButton(idx, 300);
      if (idx === sequence[userStep]) {
        userStep++;
        if (userStep === sequence.length) {
          setTimeout(() => {
            message.textContent = "Good job! Next round...";
            setTimeout(nextRound, 1200);
          }, 300);
        }
      } else {
        message.textContent = "Wrong! Game over. Press Start to try again.";
        sequence = [];
        level = 0;
        levelText.textContent = "0";
      }
    }
    // Button events
    btns.forEach((btn, i) => btn.addEventListener('click', () => userClick(i)));
    startBtn.addEventListener('click', () => {
      resetGame();
      setTimeout(nextRound, 400);
    });

    // Start state
    resetGame();
  </script>
</body>
</html>
